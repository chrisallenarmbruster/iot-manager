# IoT Manager, PostgreSQL and logical database backups.
name: iot-manager

services:
  db:
    image: postgres:16.2-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-esp32-endpoints}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: /srv/app-data/iot-manager/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks:
      - private
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-backup:
    image: prodrigestivill/postgres-backup-local:16@sha256:a0103fbce0c48ccc7693ddbb2a2bfa733048db845354f635efef9e4566de185d
    deploy:
      replicas: ${BACKUP_REPLICAS:-1}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-esp32-endpoints}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: "-Z1 --no-owner --no-privileges"
      BACKUP_SUFFIX: ".sql.gz"
      BACKUP_ON_START: "TRUE"
      SCHEDULE: "${POSTGRES_BACKUP_SCHEDULE:-15 3 * * 0}"
      BACKUP_KEEP_MINS: "${POSTGRES_BACKUP_KEEP_MINUTES:-10080}"
      BACKUP_KEEP_DAYS: "${POSTGRES_BACKUP_KEEP_DAYS:-7}"
      BACKUP_KEEP_WEEKS: "${POSTGRES_BACKUP_KEEP_WEEKS:-4}"
      BACKUP_KEEP_MONTHS: "${POSTGRES_BACKUP_KEEP_MONTHS:-3}"
      TZ: ${POSTGRES_BACKUP_TIMEZONE:-America/Chicago}
    volumes:
      - type: bind
        source: /srv/app-backups/iot-manager
        target: /backups
        bind:
          create_host_path: false
    networks:
      - private

  iot-manager:
    image: ${DOCKER_REGISTRY:-registry.rev4labs.com}/${DOCKER_IMAGE_NAME:-iot-manager}:${APP_VERSION:-2.1.0}
    deploy:
      replicas: ${APP_REPLICAS:-1}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUIET: ${QUIET:-true}
      PORT: ${PORT:-3000}
      DCP_LISTEN_PORT: ${DCP_LISTEN_PORT:-2500}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    networks:
      private:
      proxy:
        aliases:
          - iot-manager-web
    ports:
      - "${DCP_LISTEN_PORT:-2500}:${DCP_LISTEN_PORT:-2500}/tcp"

networks:
  private:
  proxy:
    external: true
